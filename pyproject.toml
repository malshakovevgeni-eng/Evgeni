[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evgeni"
version = "0.1.0"
description = "Personal Python project"
readme = "README.md"
requires-python = ">=3.14"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
